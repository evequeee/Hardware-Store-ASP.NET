syntax = "proto3";

option csharp_namespace = "HardwareStore.AggregatorService.Protos";

package hardwarestore;

// Product Service definition for gRPC communication
service ProductGrpcService {
  // Get all products
  rpc GetAllProducts (GetAllProductsRequest) returns (GetAllProductsResponse);
  
  // Get product by ID
  rpc GetProductById (GetProductByIdRequest) returns (GetProductByIdResponse);
  
  // Create a new product
  rpc CreateProduct (CreateProductRequest) returns (CreateProductResponse);
  
  // Update an existing product
  rpc UpdateProduct (UpdateProductRequest) returns (UpdateProductResponse);
  
  // Delete a product
  rpc DeleteProduct (DeleteProductRequest) returns (DeleteProductResponse);
}

// Empty request for getting all products
message GetAllProductsRequest {
}

// Response containing list of products
message GetAllProductsResponse {
  repeated ProductMessage products = 1;
}

// Request for getting a product by ID
message GetProductByIdRequest {
  string id = 1;
}

// Response for single product
message GetProductByIdResponse {
  ProductMessage product = 1;
  bool found = 2;
}

// Request for creating a product
message CreateProductRequest {
  string name = 1;
  string description = 2;
  string category = 3;
  double price = 4;
  int32 stock_quantity = 5;
  string manufacturer = 6;
}

// Response for product creation
message CreateProductResponse {
  string id = 1;
  bool success = 2;
  string message = 3;
}

// Request for updating a product
message UpdateProductRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string category = 4;
  double price = 5;
  int32 stock_quantity = 6;
  string manufacturer = 7;
  bool is_available = 8;
}

// Response for product update
message UpdateProductResponse {
  bool success = 1;
  string message = 2;
}

// Request for deleting a product
message DeleteProductRequest {
  string id = 1;
}

// Response for product deletion
message DeleteProductResponse {
  bool success = 1;
  string message = 2;
}

// Product message definition
message ProductMessage {
  string id = 1;
  string name = 2;
  string description = 3;
  string category = 4;
  double price = 5;
  int32 stock_quantity = 6;
  string manufacturer = 7;
  bool is_available = 8;
  bool is_in_stock = 9;
}
